name: Scorecard supply-chain security

# OpenSSF Scorecard: scores the repo against supply-chain best practices
# (branch protection, pinned deps, dangerous workflows, token permissions, ...)
# and uploads findings to the Security tab. Drives the OpenSSF badge in README.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  push:
    branches: [master]

# Least privilege at the top; the job opts into exactly what it needs.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to the public OpenSSF API (badge)
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results so the README badge works. Requires a public repo;
          # set to false if this repo is private.
          publish_results: true

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
