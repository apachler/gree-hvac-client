name: Scorecard supply-chain security

# OpenSSF Scorecard: scores the repo against supply-chain best practices
# (branch protection, pinned deps, dangerous workflows, token permissions, ...)
# and uploads findings to the Security tab. Drives the OpenSSF badge in README.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  push:
    branches: [master]

# Least privilege at the top; the job opts into exactly what it needs.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to the public OpenSSF API (badge)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results so the README badge works. Requires a public repo;
          # set to false if this repo is private.
          publish_results: true

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
