name: release

on:
  push:
    branches:
      - master

# semantic-release needs to push the release commit + tag, create the GitHub
# Release (with the packed .tgz asset), and comment on released issues/PRs.
# No npm publish — this fork ships via Git + GitHub Releases only.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # semantic-release >= 25 requires Node ^22.14 || >= 24.10
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
