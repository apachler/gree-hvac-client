name: release

on:
  push:
    branches:
      - master

# semantic-release needs to push the changelog commit + tag, create the GitHub
# Release, and comment on released issues/PRs. id-token enables npm provenance.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
