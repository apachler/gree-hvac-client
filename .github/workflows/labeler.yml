name: Auto-label PRs

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Maps Conventional Commit prefixes in the PR title to a label for triage and
# filtering (feat/fix/docs/...). Release notes themselves come from
# semantic-release (release-notes-generator), so this is purely for PR
# organization. Labels are created on first use if they don't already exist.
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Apply label from PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const map = [
              [/^feat(\(|!|:)/i,     'feat'],
              [/^fix(\(|!|:)/i,      'fix'],
              [/^docs(\(|!|:)/i,     'docs'],
              [/^test(s?)(\(|!|:)/i, 'test'],
              [/^chore(\(|!|:)/i,    'chore'],
              [/^refactor(\(|!|:)/i, 'refactor'],
              [/^perf(\(|!|:)/i,     'enhancement'],
              [/^ci(\(|!|:)/i,       'ci'],
              [/^build(\(|!|:)/i,    'build'],
              [/^style(\(|!|:)/i,    'style'],
            ];
            const toAdd = [];
            for (const [re, label] of map) {
              if (re.test(title)) { toAdd.push(label); break; }
            }
            if (!toAdd.length) {
              core.info(`No conventional-commit prefix matched in: "${title}"`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: toAdd,
            });
            core.info(`Applied labels: ${toAdd.join(', ')}`);
