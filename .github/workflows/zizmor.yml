name: zizmor

# Static analysis of the GitHub Actions workflows (script injection, token
# scope, credential persistence, dangerous triggers, ...). Findings go to the
# Security tab.
on:
  push:
    branches: [master]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.16.0
