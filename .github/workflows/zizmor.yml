name: zizmor

# Static analysis of the GitHub Actions workflows (script injection, token
# scope, credential persistence, dangerous triggers, ...). Findings go to the
# Security tab.
on:
  push:
    branches: [master]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Harden the runner (audit outbound connections)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.16.0
