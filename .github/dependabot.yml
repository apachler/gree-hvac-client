version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let new releases age a few days before proposing them (security
    # updates skip this), so a compromised publish is likely pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the oldest supported Node (engines.node), so
      # newer majors would let index.d.ts use APIs Node 18 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors need tsconfig changes and a typescript-eslint
      # release that supports them (eslint-plugin-jsdoc depends on it):
      # bump by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  # All GitHub Actions bumps batched into one monthly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Let new releases age a few days before proposing them (security
    # updates skip this), so a compromised publish is likely pulled first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
